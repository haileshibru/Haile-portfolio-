<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b26"/>
      <stop offset="50%" stop-color="#10071c"/>
      <stop offset="100%" stop-color="#08030e"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(168,85,247,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <circle cx="500" cy="180" r="170" fill="#8b5cf6" opacity="0.14" filter="blur(40px)"/>
  <circle cx="200" cy="350" r="140" fill="#ec4899" opacity="0.1" filter="blur(40px)"/>
  
  <!-- Browser Mockup -->
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="16" fill="#130e20" stroke="#3b2d54" stroke-width="1.5"/>
    
    <!-- Title Bar -->
    <rect width="680" height="44" rx="16" fill="#201538"/>
    <rect y="30" width="680" height="14" fill="#201538"/>
    <circle cx="25" cy="22" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="45" cy="22" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="65" cy="22" r="6" fill="#10b981" opacity="0.8"/>
    <rect x="200" y="12" width="280" height="20" rx="6" fill="#130e20" stroke="#3b2d54" stroke-width="1"/>
    <text x="340" y="26" fill="#c084fc" font-family="monospace" font-size="11" text-anchor="middle">digital-ceremony-platform.vercel.app</text>
    
    <!-- Hero Banner inside Window -->
    <g transform="translate(30, 65)">
      <!-- Header Ceremony Info -->
      <rect width="620" height="90" rx="12" fill="#22153f" stroke="#4c1d95" stroke-width="1"/>
      <circle cx="55" cy="45" r="28" fill="url(#purpleGrad)"/>
      <text x="55" y="52" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">💍</text>
      
      <text x="100" y="38" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Bethlehem &amp; Dawit’s Wedding Celebration</text>
      <text x="100" y="60" fill="#e9d5ff" font-family="sans-serif" font-size="12">Dec 28, 2025 • Addis Ababa • 142 Wishes Logged • 86 Photos</text>
      <rect x="520" y="28" width="80" height="34" rx="8" fill="#8b5cf6"/>
      <text x="560" y="50" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Export PDF</text>
      
      <!-- Split View: Left Wishes Feed, Right QR & Upload -->
      <g transform="translate(0, 105)">
        <!-- Wishes Feed Box -->
        <rect width="390" height="215" rx="12" fill="#171026" stroke="#2e1065" stroke-width="1"/>
        <text x="20" y="28" fill="#a855f7" font-family="monospace" font-size="11" font-weight="bold">RECENT GUEST WISHES &amp; SIGNATURES</text>
        
        <!-- Wish Card 1 -->
        <g transform="translate(15, 42)">
          <rect width="360" height="72" rx="8" fill="#24173d" stroke="#3b2d54" stroke-width="1"/>
          <text x="15" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Dr. Samuel &amp; Family</text>
          <text x="345" y="24" fill="#a855f7" font-family="monospace" font-size="9" text-anchor="end">10 mins ago</text>
          <text x="15" y="44" fill="#d8b4fe" font-family="sans-serif" font-size="11">"Wishing you a lifetime of endless joy, love, and continuous blessings!"</text>
          <text x="15" y="62" fill="#38bdf8" font-family="monospace" font-size="9">✍️ Digital Signature Verified</text>
        </g>

        <!-- Wish Card 2 -->
        <g transform="translate(15, 124)">
          <rect width="360" height="72" rx="8" fill="#24173d" stroke="#3b2d54" stroke-width="1"/>
          <text x="15" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Helen Tesfaye</text>
          <text x="345" y="24" fill="#a855f7" font-family="monospace" font-size="9" text-anchor="end">25 mins ago</text>
          <text x="15" y="44" fill="#d8b4fe" font-family="sans-serif" font-size="11">"Congratulations on this beautiful milestone! May God illuminate your path."</text>
          <text x="15" y="62" fill="#ec4899" font-family="monospace" font-size="9">📷 Attached 3 High-Res Photos</text>
        </g>
        
        <!-- Right QR & Keepsake Panel -->
        <g transform="translate(410, 0)">
          <rect width="210" height="215" rx="12" fill="#171026" stroke="#2e1065" stroke-width="1"/>
          <text x="105" y="28" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Scan Ceremony QR</text>
          
          <!-- Mock QR Code -->
          <g transform="translate(45, 45)">
            <rect width="120" height="120" rx="8" fill="#ffffff"/>
            <!-- QR pattern mock -->
            <rect x="10" y="10" width="30" height="30" fill="#000000"/>
            <rect x="80" y="10" width="30" height="30" fill="#000000"/>
            <rect x="10" y="80" width="30" height="30" fill="#000000"/>
            <rect x="17" y="17" width="16" height="16" fill="#ffffff"/>
            <rect x="87" y="17" width="16" height="16" fill="#ffffff"/>
            <rect x="17" y="87" width="16" height="16" fill="#ffffff"/>
            <rect x="50" y="20" width="15" height="15" fill="#000000"/>
            <rect x="50" y="55" width="20" height="20" fill="#8b5cf6"/>
            <rect x="25" y="55" width="15" height="15" fill="#000000"/>
            <rect x="80" y="60" width="30" height="15" fill="#000000"/>
            <rect x="50" y="90" width="25" height="20" fill="#000000"/>
            <rect x="90" y="90" width="20" height="20" fill="#000000"/>
          </g>
          <text x="105" y="185" fill="#c084fc" font-family="monospace" font-size="9" text-anchor="middle">Instant Guest Access</text>
          <text x="105" y="200" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Supabase Storage &amp; PG</text>
        </g>
      </g>
    </g>
  </g>
</svg>
