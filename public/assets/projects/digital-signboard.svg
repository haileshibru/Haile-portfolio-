        <text x="537" y="95" fill="#67e8f9" font-family="sans-serif" font-size="11" text-anchor="middle">Partly Cloudy • Addis Ababa</text>
        <rect x="445" y="125" width="155" height="50" rx="6" fill="#0c4a6e"/>
