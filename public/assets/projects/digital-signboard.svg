<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041822"/>
      <stop offset="50%" stop-color="#020e14"/>
      <stop offset="100%" stop-color="#010609"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(6,182,212,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="400" cy="180" r="160" fill="#06b6d4" opacity="0.12" filter="blur(40px)"/>
  
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="16" fill="#05151e" stroke="#0e7490" stroke-width="1.5"/>
    
    <rect width="680" height="44" rx="16" fill="#083344"/>
    <rect y="30" width="680" height="14" fill="#083344"/>
    <circle cx="25" cy="22" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="45" cy="22" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="65" cy="22" r="6" fill="#10b981" opacity="0.8"/>
    <rect x="200" y="12" width="280" height="20" rx="6" fill="#05151e" stroke="#0e7490" stroke-width="1"/>
    <text x="340" y="26" fill="#67e8f9" font-family="monospace" font-size="11" text-anchor="middle">digital-signboard-psi.vercel.app</text>
    
    <g transform="translate(30, 65)">
