      <text x="15" y="70" fill="#a5f3fc" font-family="monospace" font-size="12">Campus Network: Online • 10:45 AM • Addis Ababa Campus Display Unit #01</text>

      <!-- 3 Column Announcement Tiles -->
      <g transform="translate(0, 110)">
        <rect width="195" height="200" rx="8" fill="#082836" stroke="#0e7490" stroke-width="1"/>
        <rect width="195" height="30" rx="8" fill="#0c4a6e"/>
        <text x="15" y="20" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">📅 Academic Timetable</text>
        <text x="15" y="55" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="bold">CS-302 Networking</text>
        <text x="15" y="72" fill="#7dd3fc" font-family="monospace" font-size="10">Room 402 • 02:00 PM</text>
        <text x="15" y="105" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="bold">CS-401 System Design</text>
        <text x="15" y="122" fill="#7dd3fc" font-family="monospace" font-size="10">Lab 1 • 04:00 PM</text>
        <text x="15" y="155" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="bold">IT Workshop</text>
        <text x="15" y="172" fill="#7dd3fc" font-family="monospace" font-size="10">Auditorium • Tomorrow</text>

        <rect x="212" width="195" height="200" rx="8" fill="#082836" stroke="#0e7490" stroke-width="1"/>
        <rect x="212" width="195" height="30" rx="8" fill="#0c4a6e"/>
        <text x="227" y="20" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">📢 Campus News</text>
        <text x="227" y="55" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="bold">Tech Innovation Expo</text>
        <text x="227" y="75" fill="#94a3b8" font-family="sans-serif" font-size="10">Student registration open for annual tech showcase.</text>
        <text x="227" y="120" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="bold">Library Hours Extended</text>
        <text x="227" y="140" fill="#94a3b8" font-family="sans-serif" font-size="10">Open until 10:00 PM throughout exam weeks.</text>

        <rect x="425" width="195" height="200" rx="8" fill="#082836" stroke="#0e7490" stroke-width="1"/>
        <rect x="425" width="195" height="30" rx="8" fill="#0c4a6e"/>
