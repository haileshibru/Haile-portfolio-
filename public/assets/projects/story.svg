<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1208"/>
      <stop offset="50%" stop-color="#120a03"/>
      <stop offset="100%" stop-color="#080401"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(245,158,11,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="400" cy="180" r="160" fill="#f59e0b" opacity="0.12" filter="blur(40px)"/>
  
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="16" fill="#140e07" stroke="#78350f" stroke-width="1.5"/>
    
    <rect width="680" height="44" rx="16" fill="#291807"/>
    <rect y="30" width="680" height="14" fill="#291807"/>
    <circle cx="25" cy="22" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="45" cy="22" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="65" cy="22" r="6" fill="#10b981" opacity="0.8"/>
    <rect x="220" y="12" width="240" height="20" rx="6" fill="#140e07" stroke="#78350f" stroke-width="1"/>
    <text x="340" y="26" fill="#fcd34d" font-family="monospace" font-size="11" text-anchor="middle">story-two-self.vercel.app</text>
    
    <g transform="translate(30, 65)">
      <!-- Book Banner -->
      <rect width="620" height="100" rx="12" fill="#2d1c08" stroke="#92400e" stroke-width="1"/>
      <circle cx="55" cy="50" r="28" fill="#d97706"/>
      <text x="55" y="58" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">📖</text>
      
      <text x="100" y="42" fill="#ffffff" font-family="serif" font-size="20" font-weight="bold">"For I Walk by Faith, Not by Sight"</text>
      <text x="100" y="66" fill="#fde68a" font-family="sans-serif" font-size="12">The Personal Memoir of Haile Shibru • Interactive Digital Reading Edition</text>
      <text x="100" y="85" fill="#f59e0b" font-family="monospace" font-size="10">● Supabase Auth &amp; DB // Gemini AI Interactive Narrative Companion</text>

      <!-- Chapter Reader Mockup -->
      <g transform="translate(0, 115)">
        <!-- Chapter navigation sidebar -->
        <rect width="180" height="195" rx="8" fill="#1b1207" stroke="#78350f" stroke-width="1"/>
        <text x="15" y="25" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">MEMOIR CHAPTERS</text>
        <rect x="10" y="38" width="160" height="26" rx="4" fill="#78350f" opacity="0.5"/>
        <text x="20" y="55" fill="#fef3c7" font-family="sans-serif" font-size="11" font-weight="bold">Chapter 1: The Streets</text>
        <text x="20" y="85" fill="#a16207" font-family="sans-serif" font-size="11">Chapter 2: The Spark</text>
        <text x="20" y="115" fill="#a16207" font-family="sans-serif" font-size="11">Chapter 3: Debre Tabor</text>
        <text x="20" y="145" fill="#a16207" font-family="sans-serif" font-size="11">Chapter 4: The Classroom</text>
        <text x="20" y="175" fill="#a16207" font-family="sans-serif" font-size="11">Chapter 5: Building Systems</text>

        <!-- Chapter text sample -->
        <g transform="translate(195, 0)">
          <rect width="425" height="195" rx="8" fill="#1b1207" stroke="#78350f" stroke-width="1"/>
          <text x="20" y="32" fill="#ffffff" font-family="serif" font-size="15" font-weight="bold">Chapter 1 — Trials, Conviction &amp; The First Light</text>
          <text x="20" y="60" fill="#e2d9cd" font-family="sans-serif" font-size="12" line-height="1.6">"When everything visible falls away, the only compass remaining is faith.</text>
          <text x="20" y="82" fill="#e2d9cd" font-family="sans-serif" font-size="12">Through cold nights, hunger, and uncertainty, technology became a beacon</text>
          <text x="20" y="104" fill="#e2d9cd" font-family="sans-serif" font-size="12">of transformation — turning adversity into purpose..."</text>
          
          <rect x="20" y="130" width="385" height="50" rx="6" fill="#2d1c08" stroke="#92400e" stroke-width="1"/>
          <text x="35" y="152" fill="#f59e0b" font-family="monospace" font-size="10">🤖 Ask Gemini AI Reader Assistant:</text>
          <text x="35" y="168" fill="#fde68a" font-family="sans-serif" font-size="11">"Ask about the historical context or themes of resilience..."</text>
        </g>
      </g>
    </g>
  </g>
</svg>
