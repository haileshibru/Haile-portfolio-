<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428"/>
      <stop offset="50%" stop-color="#060c1a"/>
      <stop offset="100%" stop-color="#03060d"/>
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(59,130,246,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <circle cx="400" cy="200" r="170" fill="#3b82f6" opacity="0.13" filter="blur(40px)"/>
  
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="16" fill="#0d1527" stroke="#1e3a8a" stroke-width="1.5"/>
    
    <rect width="680" height="44" rx="16" fill="#172554"/>
    <rect y="30" width="680" height="14" fill="#172554"/>
    <circle cx="25" cy="22" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="45" cy="22" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="65" cy="22" r="6" fill="#10b981" opacity="0.8"/>
    <rect x="200" y="12" width="280" height="20" rx="6" fill="#0d1527" stroke="#1e3a8a" stroke-width="1"/>
    <text x="340" y="26" fill="#93c5fd" font-family="monospace" font-size="11" text-anchor="middle">professional-hub-two.vercel.app</text>
    
    <g transform="translate(30, 65)">
      <!-- Header -->
      <rect width="620" height="75" rx="10" fill="#172554" stroke="#1d4ed8" stroke-width="1"/>
      <text x="20" y="32" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Professional Hub — Career Acceleration</text>
      <text x="20" y="54" fill="#60a5fa" font-family="sans-serif" font-size="12">Bilingual Support (EN / አማርኛ) • 8 Career Services • AI Coaching Assistant</text>
      <rect x="520" y="22" width="80" height="30" rx="6" fill="#2563eb"/>
      <text x="560" y="42" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">EN | አማ</text>
      
      <!-- 4 Service Cards Grid -->
      <g transform="translate(0, 90)">
        <!-- Service 1 -->
        <rect width="295" height="95" rx="10" fill="#111c36" stroke="#1e3a8a" stroke-width="1"/>
        <text x="20" y="30" fill="#60a5fa" font-family="sans-serif" font-size="14" font-weight="bold">📄 CV &amp; Resume Engineering</text>
        <text x="20" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11">ATS-optimized resumes tailored for domestic &amp; global opportunities.</text>
        <text x="20" y="76" fill="#38bdf8" font-family="monospace" font-size="10">8 Templates • ATS Scored</text>

        <!-- Service 2 -->
        <rect x="325" width="295" height="95" rx="10" fill="#111c36" stroke="#1e3a8a" stroke-width="1"/>
        <text x="345" y="30" fill="#60a5fa" font-family="sans-serif" font-size="14" font-weight="bold">🔗 LinkedIn Optimization</text>
        <text x="345" y="52" fill="#94a3b8" font-family="sans-serif" font-size="11">Profile positioning, headline drafting, and recruiter search keywords.</text>
        <text x="345" y="76" fill="#38bdf8" font-family="monospace" font-size="10">High Search Visibility</text>

        <!-- Service 3 -->
        <rect y="110" width="295" height="95" rx="10" fill="#111c36" stroke="#1e3a8a" stroke-width="1"/>
        <text x="20" y="140" fill="#60a5fa" font-family="sans-serif" font-size="14" font-weight="bold">🎓 Academic &amp; Tech Tutoring</text>
        <text x="20" y="162" fill="#94a3b8" font-family="sans-serif" font-size="11">Hands-on programming, networking fundamentals &amp; IT mentoring.</text>
        <text x="20" y="186" fill="#38bdf8" font-family="monospace" font-size="10">1-on-1 Sessions</text>

        <!-- Service 4 -->
        <rect x="325" y="110" width="295" height="95" rx="10" fill="#111c36" stroke="#1e3a8a" stroke-width="1"/>
        <text x="345" y="140" fill="#60a5fa" font-family="sans-serif" font-size="14" font-weight="bold">🤖 AI Proficiency Coaching</text>
        <text x="345" y="162" fill="#94a3b8" font-family="sans-serif" font-size="11">Integrating Gemini, ChatGPT &amp; modern AI into professional workflows.</text>
        <text x="345" y="186" fill="#38bdf8" font-family="monospace" font-size="10">Powered by Gemini AI</text>
      </g>
    </g>
  </g>
</svg>
